# Fly.io configuration for Mario Game Backend
app = "mario-game-backend"
primary_region = "sin"  # Singapore - close to India

[build]
  builder = "heroku/buildpacks:20"

[env]
  PORT = "8080"
  FRONTEND_URL = "https://mariofront.netlify.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80
